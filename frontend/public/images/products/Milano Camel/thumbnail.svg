<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8dfc8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8860A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0a020;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg)"/>
  <!-- Decorative lines -->
  <line x1="0" y1="0" x2="600" y2="800" stroke="#C8860A" stroke-width="0.5" opacity="0.15"/>
  <line x1="600" y1="0" x2="0" y2="800" stroke="#C8860A" stroke-width="0.5" opacity="0.15"/>
  <!-- Frame border -->
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="#C8860A" stroke-width="1" opacity="0.4"/>
  <rect x="32" y="32" width="536" height="736" fill="none" stroke="#C8860A" stroke-width="0.5" opacity="0.25"/>
  <!-- Center circle for 360 icon -->
  <circle cx="300" cy="360" r="80" fill="none" stroke="#1a0a00" stroke-width="1.5" opacity="0.2"/>
  <!-- 360° text -->
  <text x="300" y="348" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#1a0a00" text-anchor="middle" opacity="0.35">360°</text>
  <text x="300" y="385" font-family="Georgia, serif" font-size="13" fill="#1a0a00" text-anchor="middle" opacity="0.3" letter-spacing="4">VISTA INTERACTIVA</text>
  <!-- Arrows suggesting rotation -->
  <path d="M 220 330 Q 300 290 380 330" fill="none" stroke="#C8860A" stroke-width="2" opacity="0.5" marker-end="url(#arrow)"/>
  <path d="M 380 390 Q 300 430 220 390" fill="none" stroke="#C8860A" stroke-width="2" opacity="0.5"/>
  <!-- Product name -->
  <text x="300" y="530" font-family="Georgia, serif" font-size="36" fill="#1a0a00" text-anchor="middle" opacity="0.6" letter-spacing="6">MILANO</text>
  <rect x="210" y="545" width="180" height="1" fill="#C8860A" opacity="0.5"/>
  <text x="300" y="575" font-family="Arial, sans-serif" font-size="11" fill="#1a0a00" text-anchor="middle" opacity="0.4" letter-spacing="3">ARAMAYUS ART · 2026</text>
  <!-- Bottom decorative element -->
  <text x="300" y="740" font-family="Arial, sans-serif" font-size="10" fill="#1a0a00" text-anchor="middle" opacity="0.3" letter-spacing="2">Arrastra para girar ‹ ›</text>
</svg>
